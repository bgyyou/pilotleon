server {
    server_name pilotleon.com www.pilotleon.com pilotleon.online www.pilotleon.online 124.156.140.217;

    root /var/www/pilotleon;
    index index.html;

    # gzip: 动态压缩 + 优先服务预压缩的 .gz（若存在）
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/ttf font/otf;

    # Vite 构建产物带 hash，文件名不变内容就不变 → 长缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pilotleon.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pilotleon.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.pilotleon.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = pilotleon.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pilotleon.com www.pilotleon.com pilotleon.online www.pilotleon.online 124.156.140.217;
    return 404; # managed by Certbot
}
